<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House price estimator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1120;--sf:#141b30;--sf2:#1b2440;--ln:#28335a;--tx:#e9edf8;--mu:#8d98b8;--ac:#f5b544;--lo:#3dd6c3;--me:#f5b544;--hi:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,#1d2a55 0,transparent 60%),var(--bg);color:var(--tx);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;padding:20px 14px 60px}
h1,h2,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:1020px;margin:auto}
header{margin:6px 0 22px}
h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
header p{color:var(--mu);margin-top:8px;max-width:46ch}
.grid{display:grid;gap:18px}
@media(min-width:860px){.grid{grid-template-columns:1.15fr .85fr;align-items:start}.res{position:sticky;top:18px}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px}
.f{margin-bottom:18px}
.f>label,.lbl{display:flex;justify-content:space-between;font-weight:500;margin-bottom:8px}
.f b{color:var(--ac);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf2);border:1px solid var(--ln);color:var(--mu);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer;transition:.2s}
.chip:hover{color:var(--tx);border-color:var(--mu)}
.chip.on{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:700;transform:scale(1.04)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:6px}
.step button{width:38px;height:38px;border-radius:9px;border:0;background:var(--ln);color:var(--tx);font-size:20px;cursor:pointer;transition:.15s}
.step button:active{transform:scale(.88);background:var(--ac);color:#1a1405}
.step span{font:700 20px 'Bricolage Grotesque',sans-serif}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.tg{display:flex;gap:8px;flex-wrap:wrap}
.sw{flex:1;min-width:120px;display:flex;align-items:center;justify-content:space-between;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--mu);transition:.2s;font:inherit}
.sw i{width:36px;height:20px;border-radius:99px;background:var(--ln);position:relative;transition:.25s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{color:var(--tx);border-color:var(--ac)}.sw.on i{background:var(--ac)}.sw.on i:after{transform:translateX(16px)}
.go{width:100%;border:0;border-radius:14px;padding:15px;font:800 17px 'Bricolage Grotesque',sans-serif;background:linear-gradient(90deg,#f5b544,#ff8f5a);color:#1a1405;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.go:hover{box-shadow:0 8px 28px #f5b54455}.go:active{transform:scale(.97)}
.go.load:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff7 50%,transparent 70%);animation:sh 1s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
svg{width:100%;height:auto;display:block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.win{fill:#222c4f;transition:fill .5s,filter .5s}
.lit .win{fill:#ffd36e;filter:drop-shadow(0 0 6px #f5b544)}
.out{text-align:center;padding:6px 0 2px}
.big{font-size:clamp(44px,11vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em}
.u{color:var(--mu);margin-top:4px}
.pill{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:99px;font-weight:700;border:1px solid;opacity:0;transform:scale(.7);transition:.4s cubic-bezier(.3,1.6,.5,1)}
.show .pill{opacity:1;transform:none}
.meter{position:relative;height:10px;border-radius:99px;margin:22px 4px 6px;background:linear-gradient(90deg,var(--lo) 0 33%,var(--me) 33% 66%,var(--hi) 66%)}
.meter i{position:absolute;top:-6px;left:0;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--bg);transform:translateX(-50%);transition:left .9s cubic-bezier(.3,1.3,.4,1);opacity:0}
.show .meter i{opacity:1}
.ml{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin:0 2px}
.msg{margin-top:12px;color:var(--hi);font-size:14px;min-height:20px;text-align:center}
details{margin-top:18px;color:var(--mu);font-size:14px}
summary{cursor:pointer}
details input{width:100%;margin-top:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;color:var(--tx);font:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>What is this house worth?</h1>
<p>Describe the house and get an estimated price in million PKR, plus a Low, Medium or High band.</p>
</header>
<div class="grid">
<form class="card" id="form" onsubmit="return false">
<div class="f"><div class="lbl">City</div><div class="chips" id="city"></div></div>
<div class="f"><div class="lbl">Area type</div><div class="chips" id="area_type"></div></div>
<div class="row f">
<div><div class="lbl">Bedrooms</div><div class="step"><button data-k="bedrooms" data-d="-1">−</button><span id="v_bedrooms"></span><button data-k="bedrooms" data-d="1">+</button></div></div>
<div><div class="lbl">Bathrooms</div><div class="step"><button data-k="bathrooms" data-d="-1">−</button><span id="v_bathrooms"></span><button data-k="bathrooms" data-d="1">+</button></div></div>
</div>
<div class="f"><label for="area_marla">Size <b id="o_area"></b></label><input type="range" id="area_marla" min="3" max="40" step="0.5"></div>
<div class="f"><label for="age_years">House age <b id="o_age"></b></label><input type="range" id="age_years" min="0" max="40" step="1"></div>
<div class="f"><div class="lbl">Condition</div><div class="chips" id="condition"></div></div>
<div class="f"><div class="lbl">Floor</div><div class="chips" id="floor_type"></div></div>
<div class="tg f" id="toggles"></div>
<button class="go" id="go">Estimate price</button>
<div class="msg" id="msg"></div>
<details><summary>API address</summary><input id="api" placeholder="https://your-ngrok-url.ngrok-free.app"></details>
</form>
<aside class="card res" id="res">
<svg id="house" viewBox="0 0 360 180" aria-label="House preview"></svg>
<div class="meter"><i id="mk"></i></div>
<div class="ml"><span>Low</span><span>Medium</span><span>High</span></div>
<div class="out">
<div class="big"><span id="price">--</span></div>
<div class="u">million PKR</div>
<div class="pill" id="pill"></div>
</div>
</aside>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const opts={city:["Karachi","Lahore","Islamabad","Peshawar","Karak","Bannu","Kohat"],area_type:["Urban","Suburban","Rural"],condition:["Poor","Fair","Good","Excellent"],floor_type:["Tiles","Marble","Cement","Wood"]};
const flags={furnished:"Furnished",has_garage:"Garage",near_main_road:"Near main road"};
const S={city:"Lahore",area_type:"Urban",bedrooms:3,bathrooms:2,area_marla:8,age_years:5,condition:"Good",furnished:"No",has_garage:"No",floor_type:"Tiles",near_main_road:"No"};
const wall={Poor:"#6a5560",Fair:"#52608a",Good:"#3d6ea8",Excellent:"#2f9a93"};
const cat={Low:"var(--lo)",Medium:"var(--me)",High:"var(--hi)"};
for(const k in opts){$(k).innerHTML=opts[k].map(v=>`<button type="button" class="chip" data-k="${k}" data-v="${v}">${v}</button>`).join("")}
$("toggles").innerHTML=Object.keys(flags).map(k=>`<button type="button" class="sw" data-f="${k}">${flags[k]}<i></i></button>`).join("");
function draw(){
 const w=100+S.area_marla*3.5,x=20,per=3,gap=(w-24)/per,ww=Math.min(32,gap-12);
 let s=`<line x1="0" y1="150" x2="360" y2="150" stroke="#28335a" stroke-width="2"/>`;
 if(S.near_main_road==="Yes")s+=`<line x1="0" y1="168" x2="360" y2="168" stroke="#8d98b8" stroke-width="3" stroke-dasharray="14 10"/>`;
 s+=`<rect x="${x}" y="62" width="${w}" height="88" rx="4" fill="${wall[S.condition]}"/>`;
 s+=`<polygon points="${x-10},64 ${x+w/2},14 ${x+w+10},64" fill="#1b2440" stroke="#f5b544" stroke-width="2"/>`;
 if(S.has_garage==="Yes")s+=`<rect x="${x+w}" y="104" width="62" height="46" rx="3" fill="#2a3560"/><rect x="${x+w+8}" y="114" width="46" height="36" fill="#141b30"/>`;
 s+=`<rect x="${x+w/2-12}" y="118" width="24" height="32" rx="3" fill="#141b30"/>`;
 for(let i=0;i<S.bedrooms;i++){const r=Math.floor(i/per),c=i%per;
  s+=`<rect class="win" style="transition-delay:${i*90}ms" x="${x+12+c*gap+(gap-12-ww)/2}" y="${70+r*26}" width="${ww}" height="18" rx="3"/>`;}
 $("house").innerHTML=s;
}
function sync(){
 document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",S[b.dataset.k]===b.dataset.v));
 document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",S[b.dataset.f]==="Yes"));
 $("v_bedrooms").textContent=S.bedrooms;$("v_bathrooms").textContent=S.bathrooms;
 $("o_area").textContent=S.area_marla+" marla";$("o_age").textContent=S.age_years+(S.age_years==1?" year":" years");
 $("area_marla").value=S.area_marla;$("age_years").value=S.age_years;
 $("res").classList.remove("lit");draw();
}
document.addEventListener("click",e=>{
 const c=e.target.closest(".chip");if(c){S[c.dataset.k]=c.dataset.v;return sync()}
 const t=e.target.closest(".sw");if(t){S[t.dataset.f]=S[t.dataset.f]==="Yes"?"No":"Yes";return sync()}
 const b=e.target.closest(".step button");if(b){const k=b.dataset.k;S[k]=Math.min(6,Math.max(1,S[k]+ +b.dataset.d));if(S.bathrooms>S.bedrooms&&k==="bedrooms")S.bathrooms=S.bedrooms;sync()}
});
["area_marla","age_years"].forEach(k=>$(k).addEventListener("input",e=>{S[k]=+e.target.value;sync()}));
try{const u=localStorage.getItem("api");if(u)$("api").value=u}catch(e){}
if(!$("api").value&&location.protocol.startsWith("http"))$("api").value=location.origin;
$("api").addEventListener("change",()=>{try{localStorage.setItem("api",$("api").value)}catch(e){}});
function count(to){const el=$("price"),t0=performance.now(),d=1100;
 (function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,4);el.textContent=(to*e).toFixed(2);if(p<1)requestAnimationFrame(f)})(t0)}
$("go").onclick=async()=>{
 const btn=$("go"),msg=$("msg");msg.textContent="";btn.classList.add("load");btn.textContent="Estimating...";
 $("res").classList.remove("show","lit");
 try{
  const base=$("api").value.trim().replace(/\/$/,"");
  const r=await fetch(base+"/predict",{method:"POST",headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"1"},body:JSON.stringify(S)});
  if(!r.ok)throw new Error("Server returned "+r.status+". Check the inputs and the API logs.");
  const d=await r.json(),p=d.predicted_price_million_pkr,c=d.price_category;
  const pill=$("pill");pill.textContent=c+" price";pill.style.color=cat[c];pill.style.borderColor=cat[c];
  $("res").classList.add("show");count(p);$("res").scrollIntoView({behavior:"smooth",block:"center"});
  $("mk").style.left={Low:"16%",Medium:"50%",High:"84%"}[c];
  setTimeout(()=>$("res").classList.add("lit"),150);
 }catch(err){
  msg.textContent=err.message.includes("Failed")?"Cannot reach the API. Check that Colab is running and the API address is correct.":err.message;
 }
 btn.classList.remove("load");btn.textContent="Estimate again";
};
sync();
</script>
</body>
</html>
